name: Deploy customer presentation

on:
  push:
    branches: [main, natethebuilder-achmea-event-presentation]
    paths:
      - 'presentation/**'
      - '.github/workflows/deploy-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Install presentation dependencies
        run: npm ci --prefix presentation
      - name: Install test browser
        run: npm exec --prefix presentation -- playwright install --with-deps chromium
      - name: Check presentation and customer build
        run: npm test --prefix presentation
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload customer build only
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
